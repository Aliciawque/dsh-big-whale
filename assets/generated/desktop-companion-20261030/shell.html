<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; media-src 'self' blob:"><title>大鲸鱼 · 桌面伙伴</title><link rel="stylesheet" href="./shell.css"></head>
<body>
<aside id="companion" aria-label="桌面鲸鱼娘">
  <iframe id="model" title="鲸鱼娘实时模型" allow="autoplay" src="../dsh-companion-20261030/pet.html?interactive=1&amp;desktop=1"></iframe>
  <button id="whale" aria-label="展开鲸鱼娘菜单" aria-expanded="false" aria-controls="menu" title="打开菜单 · 直接拖动人物"><img src="../whale-menu-20261030/whale-button-v2.png" alt="" draggable="false"></button>
  <section id="menu" role="dialog" aria-label="鲸鱼娘控制菜单" hidden>
    <header><strong><span data-i18n="title">鲸鱼娘 · 桌面伙伴</span></strong><span class="menu-actions"><button id="quit" class="quit" aria-label="关闭桌宠" title="关闭桌宠">⏻</button><button id="close-menu" aria-label="关闭鲸鱼娘菜单">×</button></span></header><div id="status" role="status">陪你写代码</div>
    <div class="group"><label class="field"><span data-i18n="outfit">套装</span><select id="outfit" aria-label="套装"><option value="maid">日常女仆</option><option value="witch">小魔女</option></select></label></div>
    <div class="group"><div class="row"><label class="field"><span data-i18n="language">语言</span><select id="language" aria-label="伙伴语言"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><label class="field"><span data-i18n="expression">表情</span><select id="expression" aria-label="伙伴表情"><option value="auto">跟随事件</option><option value="normal">正常</option><option value="happy">开心</option><option value="smile">眯眼笑</option><option value="cold">冷淡</option><option value="surprised">惊讶</option><option value="tears">流泪</option><option value="cat">卖萌</option><option value="angry">撒娇生气</option></select></label></div><div class="row"><button data-i18n="intro" id="intro">自我介绍</button><button data-i18n="stop" id="stop">停止语音</button><button data-i18n="rice" id="rice">捧饭预览</button></div></div>
    <div class="group">
      <label><input id="autoVoice" type="checkbox" checked><span data-i18n="autoVoice">事件自动播报</span></label>
      <label><input id="followPointer" type="checkbox" checked><span data-i18n="followPointer">鼠标跟随</span></label>
      <label><input id="bodyShowcase" type="checkbox" checked><span data-i18n="bodyShowcase">扭身展示</span></label>
      <label class="field"><span data-i18n="idleMotion">待机动作</span><select id="idle-motion" aria-label="待机动作"><option value="natural">自然呼吸</option><option value="twist">扭身展示</option><option value="lean">左右倾身</option><option value="shy">害羞摇摆</option><option value="showcase">综合展示</option></select></label>
      <label for="idle-gain"><span data-i18n="gain">待机动作幅度</span> <output id="idle-gain-label" for="idle-gain">80%</output></label>
      <input id="idle-gain" aria-label="待机动作幅度" type="range" min="0.2" max="1.2" step="0.05" value="0.8">
    </div>
    <div class="group"><label><span data-i18n="size">人物大小</span> <output id="size-label">240 px</output></label><input id="size" aria-label="人物大小" type="range" min="170" max="340" step="10" value="240"><div class="caption"><span data-i18n="drag">桌面上直接拖动人物，方向键可微调。</span></div><div class="row"><button data-move="-24,0" aria-label="人物向左移动">←</button><button data-move="0,24" aria-label="人物向下移动">↓</button><button data-move="0,-24" aria-label="人物向上移动">↑</button><button data-move="24,0" aria-label="人物向右移动">→</button><button data-i18n="reset" id="reset">位置复位</button><button data-i18n="hide" id="hide">隐藏人物</button></div></div>
    <div class="group"><label class="field"><span data-i18n="voice">语音试听</span><select id="voice" aria-label="默认语音类型"></select></label><div class="row"><button data-i18n="audition" id="audition">试听</button><button data-i18n="openHost" id="open-host">打开 DSH</button></div></div><div id="transcript" aria-live="polite"></div>
  </section>
</aside><script type="module" src="./shell.js"></script></body></html>
